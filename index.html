<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Convite Dhiulia</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Parisienne&family=Poppins:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <div class="convite">

    <div class="top-paper"></div>

    <img class="frame" src="imagem/fundo.png" alt="" />

    <div class="paper-band"></div>

    <div class="star s1">✦</div>
    <div class="star s2">✦</div>
    <div class="star s3">✦</div>
    <div class="star s4">✦</div>
    <div class="star s5">✦</div>

    <div class="butterfly b1">🦋</div>
    <div class="butterfly b2">🦋</div>

    <div class="content">

      <img
        class="snoopy"
        src="imagem/imagem.png"
        alt="Snoopy"
      />

      <h1>Dhiulia</h1>

      <div class="idade">
        <span>1</span>
        <span>4</span>
        <span>A</span>
        <span>N</span>
        <span>O</span>
        <span>S</span>
      </div>

      <div class="event-cards">
        <div class="event-card">
          <span class="event-number">30</span>
          <p>de maio</p>
          <small>sábado</small>
        </div>

        <div class="event-card event-card-center">
          <span class="event-label">Local</span>
          <h3>Bueno Strike</h3>
        </div>

        <div class="event-card">
          <span class="event-number">19</span>
          <p>horas</p>
          <small>confirmação</small>
        </div>
      </div>
      
      <div class="message">
        <p>Comanda individual</p>
      </div>

      <div class="whatsapp-panel">
        <label for="whatsapp-name">Confirmar presença</label>
        <input id="whatsapp-name" type="text" placeholder="Digite seu nome para confirmar..." />
        <button id="whatsapp-button" type="button">Confirmar presença no WhatsApp</button>
      </div>

    </div>

  </div>

  <script src="js/app.js"></script>
</body>
</html>
